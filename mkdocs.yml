site_name: "tree-sitter-iec61131-3-st-beckhoff"
site_description: "Tree-sitter grammar for Beckhoff TwinCAT 3 Structured Text, extending tree-sitter-iec61131-3-st."
site_url: "https://heytalepazguato.github.io/tree-sitter-iec61131-3-st-beckhoff/"
repo_url: "https://github.com/HeytalePazguato/tree-sitter-iec61131-3-st-beckhoff"
repo_name: "HeytalePazguato/tree-sitter-iec61131-3-st-beckhoff"
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
