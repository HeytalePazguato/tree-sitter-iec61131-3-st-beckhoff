name: release

# Every npm publish lives in this one file, because the registry accepts a single Trusted Publisher per package and that publisher names this workflow and the npm-publish environment.
#
#   release/<X.Y.Z>  -> publishes <X.Y.Z>-rc.<N> to dist-tag next, then tag v<X.Y.Z>-rc.<N> and a GitHub pre-release.
#   main             -> publishes <VERSION> to dist-tag latest, then tag v<VERSION> and a GitHub Release.
#
# Topology: prepare -> build (wasm, prebuilds) -> publish (npm-publish environment) -> github-release.
#
# VERSION is the source of truth. scripts/resolve-release.sh decides what a push does: VERSION 0.0.0 is the template sentinel and does nothing, and a version already on npm or a tag that already exists is skipped, so a rerun only finishes what is missing. The tag is created after the publish, so it never names a version that failed to publish.
#
# Authentication is GitHub OIDC only (id-token: write, npm >= 11.5.1). The publish job holds that permission and installs nothing: it packs the sources of this commit plus the artifacts built and tested by the build jobs of this run.
on:
  push:
    branches: [main, "release/**"]

# Least privilege: every job declares what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      publish: ${{ steps.resolve.outputs.publish }}
      npm_version: ${{ steps.resolve.outputs.npm_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the guards compare tags with HEAD and count rc tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve what this push releases
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/resolve-release.sh

  build:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    permissions:
      contents: read
    # actionlint 1.7.12 rejects the "$/" form that this zizmor audit asks for.
    uses: ./.github/workflows/build-artifacts.yml # zizmor: ignore[self-repository]

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # id-token: write is what npm Trusted Publishing and the provenance attestation authenticate with.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          # No dependency cache in publishing workflows (cache poisoning).
          package-manager-cache: false

      - name: Download wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-iec61131_3_st_twincat-wasm

      - name: Download prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Assert the tarball inputs are complete
        run: |
          set -euo pipefail
          ls -l tree-sitter-iec61131_3_st_twincat.wasm
          for platform in linux darwin win32; do
            ls -l prebuilds/"$platform"-*/*.node
          done

      - name: Assert npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("::error::npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }
          ' "$(npm --version)"

      # A prerelease carries its -rc.N only in the tarball: the release branch keeps the plain VERSION.
      - name: Stamp the prerelease version
        if: needs.prepare.outputs.prerelease == 'true'
        env:
          NPM_VERSION: ${{ needs.prepare.outputs.npm_version }}
        run: npm pkg set version="$NPM_VERSION"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" --ignore-scripts

  github-release:
    needs: [prepare, build, publish]
    # publish is skipped when a rerun finds the version already on npm; the release is still owed then.
    if: >-
      !cancelled() &&
      needs.prepare.outputs.run == 'true' &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      # contents: write creates the tag and the GitHub Release and trims old pre-releases.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-iec61131_3_st_twincat-wasm

      # gh creates the tag at this commit together with the release, so no job needs git credentials.
      - name: Create tag and GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" tree-sitter-iec61131_3_st_twincat.wasm \
            --target "$GITHUB_SHA" \
            --title "tree-sitter-iec61131-3-st-twincat ${TAG#v}" \
            --generate-notes \
            "${flags[@]}"

      - name: Trim old prereleases (keep latest 5)
        if: env.PRERELEASE == 'true'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                gh release delete "$tag" --yes --cleanup-tag
              done
