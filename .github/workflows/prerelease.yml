name: prerelease

# Develop snapshots: every push to develop builds the wasm and prebuilds and uploads them as one workflow artifact stamped 0.0.<run_number>-dev (90d retention, latest 3 kept). Nothing is tagged or published from here.
#
# The -rc.N prereleases of release/* branches are published by release.yml, not here: the npm registry accepts one Trusted Publisher per package, and that one names release.yml and the npm-publish environment, so a publish from this file would be rejected.
on:
  push:
    branches: [develop]

# Least privilege: every job declares what it needs.
permissions: {}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    # actionlint 1.7.12 rejects the "$/" form that this zizmor audit asks for.
    uses: ./.github/workflows/build-artifacts.yml # zizmor: ignore[self-repository]

  dev-build:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # actions: write lets the trim step list and delete old workflow artifacts via the GitHub API.
      actions: write
    steps:
      - name: Compute dev version
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=0.0.${RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"

      - name: Download wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-sitter-iec61131_3_st_twincat-wasm

      - name: Download prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Upload dev artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-${{ steps.ver.outputs.version }}
          path: |
            *.wasm
            prebuilds/**
          retention-days: 90
          if-no-files-found: error

      - name: Trim old dev artifacts (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | contains("-dev")) | "\(.created_at)\t\(.id)"' \
            | sort -r \
            | awk -F'\t' 'NR>3 {print $2}' \
            | xargs -r -I{} gh api -X DELETE "repos/${REPO}/actions/artifacts/{}"
