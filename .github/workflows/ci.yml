name: ci

# Gate workflow: grammar generation check + corpus tests on the OS x Node matrix, the wasm build and contract checks, and static analysis of the workflows themselves. Triggered on every relevant branch push and on PRs targeting main or develop.
#
# Until task 1.5 adds grammar.js there is nothing to generate or test, so the grammar-dependent steps are guarded with `hashFiles('grammar.js') != ''`. Task 1.5 removes those guards. The dependency install, tree-sitter CLI check and workflow lint always run.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: npm ci builds the node-tree-sitter dev dependency with node-gyp, whose Visual Studio finder cannot classify the VS 18 that windows-latest now ships.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # No dependency cache: this workflow also uploads the release wasm (cache poisoning).
          package-manager-cache: false

      # Installs tree-sitter-cli from the lockfile (pinned ~0.27.1); never install it as an unpinned global.
      - run: npm ci

      - run: npx tree-sitter --version

      # Guarded until task 1.5 adds grammar.js.
      - name: Generate parser and check it is up to date
        if: hashFiles('grammar.js') != ''
        shell: bash
        run: |
          npx tree-sitter generate
          git diff --exit-code src/

      # Guarded until task 1.5 adds grammar.js.
      - name: Test
        if: hashFiles('grammar.js') != ''
        run: npm test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # No dependency cache in the job that uploads the release wasm (cache poisoning).
          package-manager-cache: false

      - run: npm ci

      # The steps below are guarded until task 1.5 adds grammar.js (and 3.2 adds the smoke script).
      - name: Build wasm and run smoke and contract checks
        if: hashFiles('grammar.js') != ''
        run: |
          npm run build:wasm
          npm run test:wasm
          npm run check:contract

      - name: Upload wasm artifact
        if: hashFiles('grammar.js') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-sitter-iec61131_3_st_twincat-wasm
          path: tree-sitter-iec61131_3_st_twincat.wasm
          if-no-files-found: error

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rhysd/actionlint 1.7.12
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: zizmor
        run: pipx run zizmor==1.31.1 --no-online-audits .github/
